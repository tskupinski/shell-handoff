[package]
name = "shell-handoff"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Run assistant commands in a terminal pane"

[[bin]]
name = "shell-handoff"
path = "rust/main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
